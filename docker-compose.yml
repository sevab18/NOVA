services:
  db:
    image: postgres:17
    container_name: online-store-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: store_user
      POSTGRES_PASSWORD: store_password
      POSTGRES_DB: online_store

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store_user -d online_store"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-test:
    image: postgres:17
    container_name: online-store-test-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: store_test_user
      POSTGRES_PASSWORD: store_test_password
      POSTGRES_DB: online_store_test

    ports:
      - "127.0.0.1:5434:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store_test_user -d online_store_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
